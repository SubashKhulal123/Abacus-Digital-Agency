# Render Blueprint — https://render.com/docs/blueprint-spec
#
# Deploy: push this repo to GitHub, then in the Render dashboard choose
# "New +" → "Blueprint" and point it at the repo. Render reads this file
# and provisions both services automatically. Secret values (MONGO_URI,
# JWT_SECRET, RESEND_API_KEY, CLOUDINARY_*) are marked sync:false so Render
# prompts you to enter them in the dashboard instead of storing them in
# git — see docs/ENVIRONMENT_SETUP.md for what each one needs to be.

services:
  # ---- Backend API --------------------------------------------------
  - type: web
    name: abacus-digital-agency-api
    runtime: node
    plan: starter
    region: oregon
    rootDir: backend
    buildCommand: npm ci
    startCommand: node server.js
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: CLIENT_URL
        sync: false
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRE
        value: 7d
      - key: JWT_COOKIE_EXPIRE
        value: '7'
      - key: COOKIE_SECRET
        generateValue: true
      - key: ADMIN_NAME
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      # ===== RESEND EMAIL =====
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM_EMAIL
        sync: false
      - key: RESEND_FROM_NAME
        value: Abacus Digital Agency
      # ===== CLOUDINARY =====
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: RATE_LIMIT_WINDOW_MINUTES
        value: '15'
      - key: RATE_LIMIT_MAX_REQUESTS
        value: '200'

  # ---- Frontend (optional — omit this block if deploying the
  #      frontend to Vercel instead, which is the recommended path) ---
  - type: web
    name: abacus-digital-agency-web
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html