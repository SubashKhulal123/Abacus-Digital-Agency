# ------------------------------------------------------------------
# Sample NGINX config for deploying Abacus Digital Agency on a single
# VPS (DigitalOcean, Linode, EC2, etc.) — frontend static build served
# directly by NGINX, backend reverse-proxied to the PM2-managed Node
# process on port 5000. Adjust paths/domain before use.
#
# Install: copy to /etc/nginx/sites-available/abacus, then:
#   sudo ln -s /etc/nginx/sites-available/abacus /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# For HTTPS, run `sudo certbot --nginx -d yourdomain.com -d www.yourdomain.com`
# (Certbot rewrites this file to add the SSL server block automatically).
# ------------------------------------------------------------------

# Rate limit zone for the API — an extra layer in front of the app's own
# express-rate-limit, cheap insurance against high-volume abuse hitting Node at all.
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=20r/s;

server {
    listen 80;
    server_name yourdomain.com www.yourdomain.com;

    # ---- Frontend: static Vite build -----------------------------
    root /var/www/abacus-digital-agency/frontend/dist;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # ---- Backend API: reverse proxy to PM2-managed Node process ---
    location /api/ {
        limit_req zone=api_limit burst=40 nodelay;

        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # ---- SEO endpoints served by the backend at the domain root ---
    location = /sitemap.xml {
        proxy_pass http://127.0.0.1:5000/sitemap.xml;
    }
    location = /robots.txt {
        proxy_pass http://127.0.0.1:5000/robots.txt;
    }

    # Security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    client_max_body_size 12M; # allow resume/image uploads through the proxy
}
