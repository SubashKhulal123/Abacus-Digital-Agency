server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # Security headers (defense in depth alongside the backend's Helmet config)
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Long-lived caching for hashed build assets (Vite fingerprints filenames)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Service worker and manifest must revalidate — never cache stale versions
    location = /sw.js {
        expires off;
        add_header Cache-Control "no-cache";
    }
    location = /manifest.webmanifest {
        expires off;
        add_header Cache-Control "no-cache";
    }

    # SPA fallback — every unmatched route serves index.html so React Router
    # can handle client-side routing (deep links, refreshes on /blog/my-post, etc.)
    location / {
        try_files $uri $uri/ /index.html;
    }
}
